# ============================================================
# pytest Configuration File
# Controls: test discovery rules, markers, default options
# ============================================================

[pytest]

# Disable Unicode escaping in test IDs, show Chinese names normally
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = True

# Test file naming rule: files starting with test_
python_files = test_*.py

# Test class naming rule: classes starting with Test
python_classes = Test*

# Test function naming rule: functions starting with test_
python_functions = test_*

# Custom markers for test categorization
# 标记已实际打在用例上（类级按模块，函数级 smoke），可放心用 -m 筛选
# Usage: pytest -m smoke       (只跑主链路冒烟集)
#        pytest -m checkout    (只跑结算模块)
#        pytest -m login       (只跑登录模块)
markers =
    smoke: Smoke tests, core main flow
    login: Login module tests
    inventory: Inventory module tests
    cart: Cart module tests
    checkout: Checkout module tests
    compat: Compatibility tests, mobile viewport
    catalog: Dynamic catalog tests, lazy load / spinner / slider

# Default command line options (auto-applied every run)
# -v: verbose output
# --alluredir: generate Allure result files
# --clean-alluredir: clean old results before run
# --strict-markers: 使用未注册的标记时直接报错，避免 -m 拼错后静默跳过全部用例
# --output: Playwright 产物（trace）的暂存目录，放 reports/ 下避免污染项目根目录
addopts = -v --alluredir=reports/allure-results --clean-alluredir --strict-markers --output=reports/playwright-artifacts

# Test search path
testpaths = testcases

# Ignore warnings
filterwarnings =
    ignore::DeprecationWarning

# Log configuration
log_cli = True
log_level = INFO
log_format = [%(asctime)s] [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
