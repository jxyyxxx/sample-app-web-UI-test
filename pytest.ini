[pytest]
testpaths = tests

addopts = -v --alluredir=reports/allure-results --clean-alluredir --strict-markers

markers =
    smoke: 核心主流程冒烟
    login: 登录模块
    inventory: 商品列表与购物车操作
    cart: 购物车增删
    checkout: 结算流程

log_cli = true
log_cli_level = INFO
log_format = [%(asctime)s] [%(levelname)s] %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

filterwarnings =
    ignore::DeprecationWarning
